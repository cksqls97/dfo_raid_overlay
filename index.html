<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미카엘라 레이드 오버레이</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <h1>미카엘라 레이드 공략 오버레이</h1>
    <p class="hint">Chrome 116 이상에서 동작합니다. Document Picture-in-Picture로 PiP 창을 열 수 있습니다.</p>

    <button id="start-overlay" class="primary-btn">오버레이 열기</button>

    <section class="status-card" aria-live="polite">
      <h2>현재 상태</h2>
      <p id="status-text">오버레이를 열면 단계 → 몬스터 → 기믹 순으로 빠르게 확인할 수 있습니다.</p>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
