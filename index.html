<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>던파 레이드 공략 오버레이</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <h1>레이드 공략 오버레이</h1>
    <p class="hint">Chrome 116 이상에서만 동작합니다 (Document Picture-in-Picture).</p>

    <label for="raid-select">레이드 선택</label>
    <select id="raid-select"></select>

    <ol id="gimmick-list" class="gimmick-preview"></ol>

    <button id="start-overlay" class="primary-btn">오버레이 시작</button>
    <p class="hint">오버레이 창을 클릭하면 다음 기믹으로 넘어갑니다.</p>
  </main>

  <!-- 이 안의 내용이 PiP 창으로 이동합니다 -->
  <div id="overlay-host">
    <div id="overlay-content">
      <div class="gimmick-counter"></div>
      <div class="gimmick-text">레이드를 선택하고 오버레이를 시작하세요</div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
